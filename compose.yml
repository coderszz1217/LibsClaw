version: '3.8'


services:
  libsclaw:
    image: libsclaw:latest  # 本地构建: docker build -t libsclaw:latest .
    container_name: libsclaw
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "6185:6185" # LibsClaw WebUI
      - "6199:6199" # Optional. OneBot v11 Napcat Websocket Port
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/LibsClaw/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
